[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dit-flow-policy"
version = "0.1.0"
description = "ResNet-18 and conditional DiT policies with Flow Matching and advantage weighting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",
  "torchvision>=0.19",
  "numpy>=1.26",
  "pyarrow>=15",
  "av>=12",
  "Pillow>=10",
  "matplotlib>=3.8",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1"]
wandb = ["wandb>=0.17"]

[project.scripts]
awbc-train = "awbc_training.train:main"
awbc-inspect-data = "awbc_data.inspect:main"
awbc-smoke = "awbc_training.inspect_advantage:main"
awbc-inspect-policy = "awbc_models.inspect_policy:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
awbc_models = ["configs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

